    send: FUNCTION

  liquid_keyboard/my_phrases:
    name: 常用语
    type: SINGLE
    keys: ["你好, 在吗?", "稍等, 马上到", "收到, 谢谢"]
  liquid_keyboard/keyboards: [my_phrases, emoji, math, ascii, cn, history, symbollist, list, ids, symbol, tabs, pinyin, script_symbols, jp, grease, rusa, korea, lation, yinbiao, unit, yanwenzi, combing, emoji_full]

