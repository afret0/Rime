  preset_keys/Hide/label: "⌄"
  preset_keys/clipboard_window/label: "✂"
  preset_keys/liquid_keyboard_emoji/label: "☺"
  preset_keys/Keyboard_symbols/label: 符号
  preset_keys/Keyboard_number/label: "123"
  preset_keys/BackSpace/label: "✕"
  preset_keys/Mode_switch/label: 中文
  preset_keys/space/label: "—"
  preset_keys/fenci:
    click: "'"
    label: 分词
  preset_keys/my_phrases:
    command: liquid_keyboard
    label: "💬"
    option: 常用语
    send: FUNCTION
  preset_keys/history_kb:
    command: liquid_keyboard
    label: "🕘"
    option: history
    send: FUNCTION

  tool_bar/primary_button:
    action: Settings
    size: [18, 18]
    background: {type: rectangle, normal: 0x00000000}
    foreground: {style: "ic@cog_outline", normal: 0xffbfbfbf, highlight: 0xffffffff}
  tool_bar/buttons:
    - action: Hide
      size: [18, 18]
      background: {type: rectangle, normal: 0x00000000}
      foreground: {style: "ic@chevron_down", normal: 0xffbfbfbf, highlight: 0xffffffff}
    - action: my_phrases
      size: [18, 18]
      background: {type: rectangle, normal: 0x00000000}
      foreground: {style: "ic@book_outline", normal: 0xffbfbfbf, highlight: 0xffffffff}
    - action: clipboard_window
      size: [18, 18]
      background: {type: rectangle, normal: 0x00000000}
      foreground: {style: "ic@content_cut", normal: 0xffbfbfbf, highlight: 0xffffffff}
    - action: Left
      long_press_action: Right
      size: [18, 18]
      background: {type: rectangle, normal: 0x00000000}
      foreground: {style: "ic@cursor_move", normal: 0xffbfbfbf, highlight: 0xffffffff}
    - action: history_kb
      size: [18, 18]
      background: {type: rectangle, normal: 0x00000000}
      foreground: {style: "ic@history", normal: 0xffbfbfbf, highlight: 0xffffffff}
  tool_bar/button_spacing: 40

  liquid_keyboard/my_phrases:
    name: 常用语
    type: SINGLE
    keys: ["你好, 在吗?", "稍等, 马上到", "收到, 谢谢"]
  liquid_keyboard/keyboards: [my_phrases, emoji, math, ascii, cn, history, symbollist, list, ids, symbol, tabs, pinyin, script_symbols, jp, grease, rusa, korea, lation, yinbiao, unit, yanwenzi, combing, emoji_full]

