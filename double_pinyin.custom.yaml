patch:
  switches/@0/states: [ 中, EN ]
  switches/@2/reset: 1  # 默认使用简体输出（汉字）
  switches/@3/reset: 1  # 默认使用英文标点
  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 1
  "schema/dependencies":
    - stroke
    - radical_pinyin
  "engine/processors":
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@radical_lookup_trigger
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  "engine/segmentors":
    - ascii_segmentor
    - matcher
    - affix_segmentor@radical_lookup
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  engine/translators:
    - punct_translator
    - lua_translator@date_time_translator
    - "table_translator@custom_phrase"
    - table_translator@radical_lookup
    - reverse_lookup_translator
    - script_translator
  engine/filters:
    - simplifier
    - lua_filter@demote_rare_char_filter
    - lua_filter@hide_unrenderable_filter
    - reverse_lookup_filter@radical_reverse_lookup
    - uniquifier
  translator/dictionary: luna_pinyin_kk
  translator/enable_user_dict: false
  translator/enable_encoder: false
  translator/encode_commit_history: false
  speller/auto_select: false
  translator/preedit_format: []  # 编码区显示键盘实际按键, 不做全拼转换
  "schema/zhung_icon": icons/zhung.ico
  "schema/ascii_icon": icons/ascii.ico
  "recognizer/patterns/radical_lookup": "~[a-z]*'?$"
  radical_lookup:
    tag: radical_lookup
    dictionary: radical_pinyin
    prefix: "~"
    suffix: "'"
    tips: "〔拆字〕"
    enable_completion: true
    enable_sentence: false
    enable_user_dict: false
    comment_format:
      - "erase/^.*$//"
  hide_unrenderable_filter:
    tags: [ radical_lookup ]
  radical_reverse_lookup:
    tags: [ radical_lookup ]
    overwrite_comment: true
    dictionary: luna_pinyin_kk
    comment_format:
      - "xform/^/(/"
      - "xform/$/)/"
