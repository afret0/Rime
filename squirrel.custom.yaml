patch:
  app_options:
    com.microsoft.VSCode:
      ascii_mode: true
    com.microsoft.VSCodeInsiders:
      ascii_mode: true
    com.apple.Terminal:
      ascii_mode: true
    com.jetbrains.goland:
      ascii_mode: true
    com.jetbrains.goland-EAP:
      ascii_mode: true
    com.jetbrains.datagrip:
      ascii_mode: true
    com.postmanlabs.mac:
      ascii_mode: true


  style:
    color_scheme: chinese_green
    font_face: "PingFang SC"
    font_point: 16
    label_font_point: 16
    line_spacing: 2
    spacing: 5
    candidate_list_layout: linear
    candidate_format: "%c %@"
    inline_preedit: true

  preset_color_schemes:
    afreto:
      name: "afreto"
      author: "Copilot"
      back_color: 0x2E3B2B
      border_color: 0x425B3E
      border_width: 3
      border_height: 3
      corner_radius: 8
      candidate_text_color: 0xC0D8C5
      comment_text_color: 0x749B7A
      label_color: 0x749B7A
      hilited_back_color: 0x2E3B2B
      hilited_candidate_back_color: 0x6C8F5E
      hilited_candidate_text_color: 0xFFFFFF
      hilited_comment_text_color: 0xC0D8C5
      hilited_candidate_label_color: 0xFFFFFF
      text_color: 0xC0D8C5

    chinese_blue:
